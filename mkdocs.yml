site_name: paperless-llm
site_description: Let AI organize your documents — so you don't have to.
repo_url: https://github.com/dnlrsr/paperless-llm
repo_name: dnlrsr/paperless-llm
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Quickstart: getting-started/quickstart.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - user-guide/index.md
    - How It Works: user-guide/workflow.md
    - Dashboard: user-guide/dashboard.md
    - Reviewing Documents: user-guide/documents.md
    - Analysis: user-guide/analysis.md
    - Custom Prompts: user-guide/prompts.md
    - Job Monitor: user-guide/jobs.md
    - Settings: user-guide/settings.md
  - Providers:
    - providers/index.md
    - LLM Providers: providers/llm-providers.md
    - OCR Providers: providers/ocr-providers.md
  - Advanced:
    - advanced/index.md
    - Auto-Processing: advanced/auto-processing.md
    - PDF Features: advanced/pdf-features.md
    - Ollama Cold Start: advanced/ollama-cold-start.md
  - Reference:
    - Environment Variables: reference/environment-variables.md

services:
  # ─── Core infrastructure ─────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Paperless-ngx ───────────────────────────────────────────────────────────

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_URL: http://localhost:8001
      PAPERLESS_SECRET_KEY: change-me-in-production-secret-key-123
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_TIME_ZONE: Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Ollama (optional – remove if you run Ollama outside Docker) ────────────
  # Uncomment this block to run Ollama as part of this Compose project.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   environment:
  #     # Keep models loaded in VRAM for 2 hours after last request.
  #     # Use -1 to keep them loaded indefinitely.
  #     OLLAMA_KEEP_ALIVE: 2h
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # Uncomment and adjust for GPU passthrough:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]

  # ─── paperless-llm (API + Web UI) ───────────────────────────────────────────

  paperless-llm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      # All other settings (LLM_PROVIDER, LLM_MODEL, OCR_PROVIDER, AUTH_ENABLED, JWT_SECRET, …)
      # are loaded from .env — see .env.example for the full reference.
    ports:
      - "3000:80"
    volumes:
      - db_data:/app/data
      - prompts_data:/app/prompts

volumes:
  redis_data:
  postgres_data:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
  db_data:
  prompts_data:
